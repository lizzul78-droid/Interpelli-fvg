name: Aggiorna interpelli

on:
  schedule:
    - cron: "30 3 * * *"            # completo: ogni giorno (in Italia circa 5:30-6:30 del mattino)
    - cron: "0 7,11,15,19 * * *"    # solo albi Nuvola: 4 volte al giorno
  workflow_dispatch:
    inputs:
      modo:
        description: "completo, nuvola oppure test-telegram"
        default: "completo"

permissions:
  contents: write

concurrency:
  group: aggiorna-interpelli
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le librerie
        run: pip install -r requirements.txt

      - name: Scegli la modalita
        id: modo
        run: |
          MODO="${{ github.event.inputs.modo }}"
          if [ "${{ github.event.schedule }}" = "0 7,11,15,19 * * *" ]; then MODO="nuvola"; fi
          if [ -z "$MODO" ]; then MODO="completo"; fi
          echo "modo=$MODO" >> "$GITHUB_OUTPUT"
          echo "Modalita: $MODO"

      - name: Cerca gli interpelli
        if: steps.modo.outputs.modo != 'test-telegram'
        env:
          CONTATTO: ${{ secrets.CONTATTO_EMAIL }}
        run: |
          CONTATTO="${CONTATTO:-tua@email.it}"
          if [ "${{ steps.modo.outputs.modo }}" = "nuvola" ]; then
            python crawler_fvg.py --nuvola-only --out docs/data --email "$CONTATTO"
          else
            python crawler_fvg.py --schools data/scuole_fvg.csv --nuvola --out docs/data --email "$CONTATTO"
          fi

      - name: Novita e messaggi Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ "${{ steps.modo.outputs.modo }}" = "test-telegram" ]; then
            python finalize.py docs/data --test
          else
            python finalize.py docs/data
          fi

      - name: Salva i risultati
        if: steps.modo.outputs.modo != 'test-telegram'
        run: |
          git config user.name "interpelli-bot"
          git config user.email "interpelli-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Nessun cambiamento da salvare"
          else
            git commit -m "Aggiornamento dati"
            git pull --rebase
            git push
          fi
